version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticket-system-api
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=8080
      - JWT_SECRET=${JWT_SECRET:-change-this-to-a-long-random-secret}
      - DATABASE_PATH=/app/database/tickets.db
    volumes:
      - ticket-db-data:/app/database
    restart: unless-stopped

volumes:
  ticket-db-data:
